name: Update lottery draws

on:
  schedule:
    # เวลาเป็น UTC (ไทย = UTC+7) — วันออกรางวัล ทุก 30 นาที ช่วง 15:00–18:30 น. เวลาไทย
    - cron: "*/30 8-11 1,2,16,17,30 * *"
    # สำรอง: เช็กวันละครั้ง 19:15 น. เวลาไทย
    - cron: "15 12 * * *"
    # เลขเด็ด: เช็กเพิ่มวันละครั้ง 09:20 น. เวลาไทย
    - cron: "20 2 * * *"
    # ตัวเฝ้าผลวันหวยออก: เริ่ม 10:00 / 12:00 / 14:00 น. แล้วรอเช็กเองจนได้ผลครบ (กันกรณี GitHub ตั้งเวลาช้า)
    - cron: "0 3,5,7 1,2,16,17,30 * *"
  workflow_dispatch:
    inputs:
      watch:
        description: "เฝ้าผลวันนี้จนครบ (ใช้ในวันหวยออก)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  watch:
    # งานยาว: นั่งรอผลในวันหวยออก (สูงสุด ~6 ชม.) — ไม่ใช่วันหวยออกจะจบทันที
    if: github.event.schedule == '0 3,5,7 1,2,16,17,30 * *' || (github.event_name == 'workflow_dispatch' && inputs.watch)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: watch-draw
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Watch for today's results
        run: bash scripts/watch-draw.sh

  update:
    if: github.event.schedule != '0 3,5,7 1,2,16,17,30 * *' && !(github.event_name == 'workflow_dispatch' && inputs.watch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: update-draws
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest results
        run: node scripts/update-draws.mjs
      - name: Fetch lucky numbers (เลขเด็ด) — ถ้าดึงไม่ได้ก็ข้าม ไม่กระทบผลรางวัล
        continue-on-error: true
        run: node scripts/update-tips.mjs
      - name: Commit lucky numbers if changed
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain -- data/tips.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tips.json
            git commit -m "Update lucky numbers" && git push || echo "push skipped"
          else
            echo "tips unchanged"
          fi
      - name: Commit if there is a new draw
        run: |
          if git diff --quiet -- data/draws.json data/prizes.json; then echo "no change"; exit 0; fi
          # บันทึกเฉพาะเมื่อมีงวดใหม่ (ไม่ commit แค่เพราะเวลาเช็กเปลี่ยน)
          if git diff -U0 -- data/draws.json | grep -q '"d":' || ! git diff --quiet -- data/prizes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/draws.json data/prizes.json
            git commit -m "Add new draw results"
            git push || (git pull --rebase -X theirs && git push)
          else
            echo "only lastCheck changed; skip commit"
          fi
