name: Update lottery draws

on:
  schedule:
    # เวลาเป็น UTC (ไทย = UTC+7) — วันออกรางวัล ทุก 30 นาที ช่วง 15:00–18:30 น. เวลาไทย
    - cron: "*/30 8-11 1,2,16,17,30 * *"
    # สำรอง: เช็กวันละครั้ง 19:15 น. เวลาไทย
    - cron: "15 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest results
        run: node scripts/update-draws.mjs
      - name: Commit if there is a new draw
        run: |
          if git diff --quiet -- data/draws.json data/prizes.json; then echo "no change"; exit 0; fi
          # บันทึกเฉพาะเมื่อมีงวดใหม่ (ไม่ commit แค่เพราะเวลาเช็กเปลี่ยน)
          if git diff -U0 -- data/draws.json | grep -q '"d":' || ! git diff --quiet -- data/prizes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/draws.json data/prizes.json
            git commit -m "Add new draw results"
            git push
          else
            echo "only lastCheck changed; skip commit"
          fi
